name: VUC CI — Governed Sandbox Runtime & Integrity

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  execution-integrity:
    name: VUC Sandbox Runtime (100% Gates + Execution Integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit GitHub Actions Runner (sandbox runtime)
        run: |
          echo "=== VUC RUNNER AUDIT — GitHub Actions Sandbox ==="
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname: $(hostname)"
          echo "kernel: $(uname -r)"
          echo "architecture: $(uname -m)"
          echo "cpu_count: $(nproc)"
          echo "cpu_model: $(lscpu | awk -F: '/Model name/{gsub(/^[ \\t]+/,"",$2); print $2}')"
          echo "memory_bytes: $(free -b | awk '/Mem:/{print $2}')"
          free -h
          echo "--- disk ---"
          df -h /
          df -B1 / | awk 'NR==2 {printf "disk_total_bytes: %s\\ndisk_avail_bytes: %s\\n", $2, $4}'
          echo "--- runner env ---"
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "RUNNER_OS: $RUNNER_OS"
          echo "RUNNER_ARCH: $RUNNER_ARCH"
          echo "RUNNER_NAME: $RUNNER_NAME"
          echo "ImageOS: $ImageOS"
          echo "--- node ---"
          node -v 2>/dev/null || true
          which node || true

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bend Runtime (HVM3 / Bend Compiler)
        run: |
          mkdir -p bin/native/bin
          bash scripts/install-bend.sh || true

      - name: Normalize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install native Bend
        run: npm run install:bend

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Reject unresolved merge conflict markers
        run: |
          set -euo pipefail
          matches="$(git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!*.lock' || true)"
          if [ -n "$matches" ]; then
            echo "ERROR: unresolved Git merge conflict markers detected:"
            printf '%s\\n' "$matches"
            exit 1
          fi
          echo "Merge conflict marker gate: PASS"

      - name: Run GOS3 Contract Audit
        run: npm run verify:gos3

      - name: Run VUC Sandbox Runtime & 100% Quality Gates
        run: npm run test:ci
        env:
          CI: "true"
          VUC_SANDBOX: "strict"

      - name: Build Production Assets
        run: npm run build

      - name: Build CLI Release Artifact
        run: npm run build:cli

      - name: Verify CLI and server artifacts
        run: |
          set -euo pipefail
          test -s dist/vua.cjs
          test -s dist/server.cjs
          echo "dist/vua.cjs: PASS ($(wc -c < dist/vua.cjs) bytes)"
          echo "dist/server.cjs: PASS ($(wc -c < dist/server.cjs) bytes)"

      - name: Verify package bin contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          if (!pkg.bin || typeof pkg.bin !== 'object') {
            throw new Error('package.json bin contract missing');
          }
          for (const [name, target] of Object.entries(pkg.bin)) {
            if (!fs.existsSync(target)) {
              throw new Error(`bin contract broken: ${name} -> ${target} does not exist`);
            }
            console.log(`bin contract: ${name} -> ${target}: PASS`);
          }
          NODE

      - name: Execute packaged CLI contract
        run: |
          set -euo pipefail
          node dist/vua.cjs --help >/tmp/vuc-help.txt
          grep -q "VUC\|VUA" /tmp/vuc-help.txt
          node dist/vua.cjs status
          node dist/vua.cjs conformance

      - name: Verify npm package contract
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm pack --dry-run --json > /tmp/vuc-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vuc-pack.json', 'utf8'));
          const files = new Set((data[0]?.files ?? []).map(f => f.path));
          for (const required of ['dist/vua.cjs', 'dist/server.cjs', 'package.json']) {
            if (!files.has(required)) {
              throw new Error(`npm package contract broken: missing ${required}`);
            }
            console.log(`npm package contract: ${required}: PASS`);
          }
          NODE

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuc-execution-evidence
          path: |
            .vortex-evidence.json
            reports/execution-evidence/**
          if-no-files-found: warn

  livebench-2026:
    name: VUC LiveBench 2026 — Full Suite
    # This job is intentionally a first-class CI gate. For the mobile path,
    # register the A23 as a self-hosted arm64 runner with label vuc-livebench.
    runs-on: [self-hosted, linux, arm64, vuc-livebench]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install VUC
        run: npm ci --no-audit --no-fund

      - name: Verify LiveBench runtime contract
        run: npm run test:livebench-runtime

      - name: Verify full-suite prerequisites
        run: |
          set -euo pipefail
          python3 --version
          docker --version
          test -n "${VUC_LIVEBENCH_API_BASE:-}${VUC_LIVEBENCH_MODEL_PATH:-}" || {
            echo "ERROR: configure VUC_LIVEBENCH_API_BASE or VUC_LIVEBENCH_MODEL_PATH on the runner"
            exit 1
          }

      - name: Run complete LiveBench 2026
        env:
          VUC_LIVEBENCH_RELEASE: "2026-06-25"
          VUC_LIVEBENCH_MODE: "sequential"
          VUC_LIVEBENCH_PARALLEL: "1"
          VUC_LIVEBENCH_EVIDENCE: "${{ github.workspace }}/livebench-2026-evidence.json"
        run: npm run benchmark:livebench -- --resume --retry-failures

      - name: Upload LiveBench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuc-livebench-2026-evidence
          path: |
            livebench-2026-evidence.json
            **/all_groups.csv
            **/all_tasks.csv
            **/*.jsonl
          if-no-files-found: warn
\n