name: VUC CI — Governed Sandbox Runtime & Integrity

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  execution-integrity:
    name: VUC Sandbox Runtime (100% Gates + Execution Integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit GitHub Actions Runner (sandbox runtime)
        run: |
          echo "=== VUC RUNNER AUDIT — GitHub Actions Sandbox ==="
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname: $(hostname)"
          echo "kernel: $(uname -r)"
          echo "architecture: $(uname -m)"
          echo "cpu_count: $(nproc)"
          echo "cpu_model: $(lscpu | awk -F: '/Model name/{gsub(/^[ \\t]+/,"",$2); print $2}')"
          echo "memory_bytes: $(free -b | awk '/Mem:/{print $2}')"
          free -h
          echo "--- disk ---"
          df -h /
          df -B1 / | awk 'NR==2 {printf "disk_total_bytes: %s\\ndisk_avail_bytes: %s\\n", $2, $4}'
          echo "--- runner env ---"
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "RUNNER_OS: $RUNNER_OS"
          echo "RUNNER_ARCH: $RUNNER_ARCH"
          echo "RUNNER_NAME: $RUNNER_NAME"
          echo "ImageOS: $ImageOS"
          echo "--- node ---"
          node -v 2>/dev/null || true
          which node || true

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bend Runtime (HVM3 / Bend Compiler)
        run: |
          mkdir -p bin/native/bin
          bash scripts/install-bend.sh || true

      - name: "AGENT dependency — validate lockfile"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error('package-lock.json must use lockfileVersion 3');
          if (lock.name !== '@vucfoundation/vuc' || lock.version !== '1.0.2') {
            throw new Error('package-lock.json identity mismatch');
          }
          const requiredOptional = [
            'node_modules/@rollup/rollup-linux-arm64-gnu',
            'node_modules/@rollup/rollup-linux-x64-gnu',
            'node_modules/lightningcss-linux-arm64-gnu',
            'node_modules/lightningcss-linux-x64-gnu'
          ];
          for (const path of requiredOptional) {
            if (!lock.packages?.[path]) throw new Error('lockfile missing required optional package: ' + path);
          }
          console.log('dependency agent: lockfile static contract PASS');
          NODE
          git diff --exit-code -- package-lock.json

      - name: "AGENT dependency — npm ci"
        run: npm ci --no-audit --no-fund

      - name: Install native Bend
        run: npm run install:bend

      - name: VUC Preflight — unified repository and release contract
        run: bash scripts/vuc-preflight.sh

      - name: "AGENT security — reject unresolved merge markers"
        run: |
          set -euo pipefail
          matches="$(git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!*.lock' || true)"
          if [ -n "$matches" ]; then
            echo "ERROR: unresolved Git merge conflict markers detected:"
            printf '%s\\n' "$matches"
            exit 1
          fi
          echo "security agent: merge conflict marker gate PASS"

      - name: "AGENT security — GOS3 contract"
        run: npm run verify:gos3

      - name: "AGENT test — VUC sandbox runtime and quality gates"
        run: npm run test:ci
        env:
          CI: "true"
          VUC_SANDBOX: "strict"

      - name: "AGENT build — production assets"
        run: npm run build

      - name: "AGENT cli — release artifact"
        run: npm run build:cli

      - name: "AGENT cli — verify artifacts"
        run: |
          set -euo pipefail
          test -s dist/vua.cjs
          test -s dist/server.cjs
          echo "cli agent: dist/vua.cjs PASS ($(wc -c < dist/vua.cjs) bytes)"
          echo "cli agent: dist/server.cjs PASS ($(wc -c < dist/server.cjs) bytes)"

      - name: "AGENT package — verify bin contract"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          if (!pkg.bin || typeof pkg.bin !== 'object') throw new Error('package.json bin contract missing');
          for (const [name, target] of Object.entries(pkg.bin)) {
            if (!fs.existsSync(target)) throw new Error('bin contract broken: ' + name + ' -> ' + target);
            console.log('package agent: bin ' + name + ' -> ' + target + ': PASS');
          }
          NODE

      - name: "AGENT cli — execute packaged CLI"
        run: |
          set -euo pipefail
          node dist/vua.cjs --help >/tmp/vuc-help.txt
          grep -q "VUC\|VUA" /tmp/vuc-help.txt
          node dist/vua.cjs status
          node dist/vua.cjs conformance

      - name: "AGENT package — verify npm package"
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm pack --dry-run --json > /tmp/vuc-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vuc-pack.json', 'utf8'));
          const files = new Set((data[0]?.files ?? []).map(f => f.path));
          for (const required of ['dist/vua.cjs', 'dist/server.cjs', 'package.json']) {
            if (!files.has(required)) throw new Error('npm package contract broken: missing ' + required);
            console.log('package agent: ' + required + ': PASS');
          }
          NODE

      - name: "AGENT release — record failure owner"
        if: failure()
        run: |
          echo "RELEASE = BLOCKED"
          echo "The failing step above owns its failure class."
          echo "Do not broaden the fix to unrelated CI responsibilities."

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuc-execution-evidence
          path: |
            .vortex-evidence.json
            reports/execution-evidence/**
          if-no-files-found: warn

  release-contract-arm64:
    name: VUC Release Contract (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "AGENT dependency — npm ci ARM64"
        run: npm ci --no-audit --no-fund

      - name: "AGENT dependency — verify package identity"
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if (p.name !== "@vucfoundation/vuc" || p.version !== "1.0.2") process.exit(1);'
          echo "dependency agent: package identity PASS"

      - name: "AGENT native-arm64 — verify native optional packages"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'node_modules/@rollup/rollup-linux-arm64-gnu',
            'node_modules/lightningcss-linux-arm64-gnu',
          ];
          for (const dir of paths) {
            if (!fs.existsSync(dir)) throw new Error('native-arm64 agent: missing installed package ' + dir);
            console.log('native-arm64 agent: installed ' + dir + ': PASS');
          }
          NODE

      - name: "AGENT native-arm64 — production build"
        run: npm run build

      - name: "AGENT cli — ARM64 release artifact"
        run: npm run build:cli

      - name: "AGENT package — ARM64 release artifacts"
        run: |
          set -euo pipefail
          test -s dist/vua.cjs
          test -s dist/server.cjs
          file dist/vua.cjs dist/server.cjs || true
          echo "package agent: ARM64 dist/vua.cjs PASS ($(wc -c < dist/vua.cjs) bytes)"
          echo "package agent: ARM64 dist/server.cjs PASS ($(wc -c < dist/server.cjs) bytes)"

      - name: "AGENT cli — execute ARM64 CLI"
        run: |
          set -euo pipefail
          node dist/vua.cjs --help >/tmp/vuc-help.txt
          grep -q "VUC\|VUA" /tmp/vuc-help.txt
          node dist/vua.cjs status
          node dist/vua.cjs conformance

      - name: "AGENT package — ARM64 npm package contract"
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm pack --dry-run --json > /tmp/vuc-pack-arm64.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vuc-pack-arm64.json', 'utf8'));
          const files = new Set((data[0]?.files ?? []).map(f => f.path));
          for (const required of ['dist/vua.cjs', 'dist/server.cjs', 'package.json']) {
            if (!files.has(required)) throw new Error('npm package contract broken: missing ' + required);
            console.log('package agent: ARM64 ' + required + ': PASS');
          }
          NODE

      - name: "AGENT release — record ARM64 failure owner"
        if: failure()
        run: |
          echo "RELEASE = BLOCKED"
          echo "ARM64 failure remains owned by the failing agent step."
          echo "Do not infer ARM64 compatibility from x64 success."

  release-gate:
    name: VUC Release Agent (Evidence Aggregation)
    if: always()
    needs:
      - execution-integrity
      - release-contract-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "AGENT release — aggregate mandatory gates"
        env:
          SANDBOX_RESULT: ${{ needs.execution-integrity.result }}
          ARM64_RESULT: ${{ needs.release-contract-arm64.result }}
        run: |
          set -euo pipefail
          echo "execution-integrity: $SANDBOX_RESULT"
          echo "release-contract-arm64: $ARM64_RESULT"

          if [ "$SANDBOX_RESULT" != "success" ] || [ "$ARM64_RESULT" != "success" ]; then
            echo "RELEASE = BLOCKED"
            echo "A mandatory gate failed or did not complete successfully."
            exit 1
          fi

          echo "RELEASE = READY"
          echo "All mandatory CI release contracts passed."
