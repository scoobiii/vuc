name: VUC Performance Matrix — CPU × Bend

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-js
            engine: js
          - name: cpu-bend
            engine: bend

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install native Bend
        if: matrix.engine == 'bend'
        run: npm run install:bend

      - name: Verify Bend runtime
        if: matrix.engine == 'bend'
        run: |
          set -euo pipefail
          test -x ./bin/native/bin/bend
          ./bin/native/bin/bend version

      - name: Run CPU benchmark
        env:
          VUC_BENCH_ENGINE: ${{ matrix.engine }}
          VUC_GPU_RUNNER: false
          VUC_GPU_DEVICE: ''
          VUC_BENCH_SAMPLES: 1000
          VUC_BENCH_WARMUP: 100
        run: npm run bench:governance

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuc-performance-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: ignore
