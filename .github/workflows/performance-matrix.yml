name: VUC Performance Matrix — CPU × Bend × GPU

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-js
            engine: js
            gpu: false
          - name: cpu-bend
            engine: bend
            gpu: false
          - name: gpu-js
            engine: js
            gpu: true
          - name: gpu-bend
            engine: bend
            gpu: true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install native Bend
        if: matrix.gpu == false && matrix.engine == 'bend'
        run: npm run install:bend

      - name: Verify Bend runtime
        if: matrix.gpu == false && matrix.engine == 'bend'
        run: |
          set -euo pipefail
          test -x ./bin/native/bin/bend
          ./bin/native/bin/bend version

      - name: Run CPU benchmark
        if: matrix.gpu == false
        env:
          VUC_BENCH_ENGINE: ${{ matrix.engine }}
          VUC_GPU_RUNNER: false
          VUC_GPU_DEVICE: ''
          VUC_BENCH_SAMPLES: 1000
          VUC_BENCH_WARMUP: 100
        run: npm run bench:governance

      - name: Check Colab credentials
        if: matrix.gpu == true
        id: colab_auth
        env:
          GOOGLE_COLAB_ACCESS_TOKEN: ${{ secrets.GOOGLE_COLAB_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -n "${GOOGLE_COLAB_ACCESS_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            mkdir -p artifacts
            cat > "artifacts/gpu-status.json" <<'EOF'
          {
            "status": "UNAVAILABLE",
            "provider": "google-colab",
            "reason": "GOOGLE_COLAB_ACCESS_TOKEN is not configured for this workflow context",
            "required_for_certification": true
          }
          EOF
          fi

      - name: Execute real GPU cell on Google Colab
        if: matrix.gpu == true && steps.colab_auth.outputs.available == 'true'
        env:
          GOOGLE_COLAB_ACCESS_TOKEN: ${{ secrets.GOOGLE_COLAB_ACCESS_TOKEN }}
          VUC_GPU_CELL: ${{ matrix.name }}
          VUC_COLAB_ACCELERATOR: ${{ vars.VUC_COLAB_ACCELERATOR || 'L4' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx tsx scripts/colab-gpu-matrix.ts | tee "artifacts/${VUC_GPU_CELL}.json"

      - name: Mark GPU cell unavailable
        if: matrix.gpu == true && steps.colab_auth.outputs.available != 'true'
        run: echo "GPU cell status: UNAVAILABLE (Colab credentials unavailable)"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuc-performance-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
