name: Agent Patch Arena — Promotion Audit

on:
  workflow_run:
    workflows: ["Agent Patch Arena — Benchmark Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion-audit:
    name: Verify promotion is CI-only
    runs-on: ubuntu-latest
    steps:
      - name: Audit promotion policy
        shell: bash
        run: |
          set -euo pipefail
          echo "Arena promotion is audit-only."
          echo "No workflow is authorized to merge, push main, or enable auto-merge."
          echo "PASS: promotion side effects are disabled."
