name: VUC Micro-LLM Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/micro-llm/**"
      - "docs/micro-llm-benchmark/**"
      - ".github/workflows/micro-llm-benchmark.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Micro-LLM Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run benchmark:models:validate
      - run: npm run lint
      - name: Collect runner environment
        run: |
          mkdir -p reports/micro-llm-benchmark
          npm run benchmark:environment > reports/micro-llm-benchmark/environment.json
      - name: Publish validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: micro-llm-contract-evidence
          path: reports/micro-llm-benchmark/environment.json

  real-execution:
    name: Real Model Execution (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: ${{ vars.VUC_LLM_COMMAND != '' && vars.VUC_LLM_MODEL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Execute configured real runtime
        env:
          VUC_LLM_COMMAND: ${{ vars.VUC_LLM_COMMAND }}
          VUC_LLM_MODEL: ${{ vars.VUC_LLM_MODEL }}
          VUC_LLM_TIMEOUT_MS: ${{ vars.VUC_LLM_TIMEOUT_MS || '120000' }}
        run: |
          mkdir -p reports/micro-llm-benchmark
          npm exec tsx benchmarks/micro-llm/runtime/run.ts | tee reports/micro-llm-benchmark/execution-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-llm-execution-evidence
          path: reports/micro-llm-benchmark/execution-evidence.json

  runtime-not-configured:
    name: Real Runtime Not Configured
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.VUC_LLM_COMMAND == '' || vars.VUC_LLM_MODEL == '' }}
    steps:
      - run: |
          echo "::warning::Real LLM runtime is not configured."
          echo "Status: BLOCKED"
          echo "No model execution is counted."
