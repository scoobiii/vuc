name: VUC Micro-LLM Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/micro-llm/**"
      - "docs/micro-llm-benchmark/**"
      - ".github/workflows/micro-llm-benchmark.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Micro-LLM Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run benchmark:models:validate
      - run: npm run lint
      - name: Collect runner environment
        run: |
          mkdir -p reports/micro-llm-benchmark
          npm run benchmark:environment > reports/micro-llm-benchmark/environment.json
      - name: Publish validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: micro-llm-contract-evidence
          path: reports/micro-llm-benchmark/environment.json

  real-execution:
    name: Real Model Execution (mandatory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: BOOT environment
        run: |
          chmod +x scripts/bootstrap-environment.sh
          VUC_BOOT_PROFILE="$RUNNER_TEMP/vuc-environment.json" scripts/bootstrap-environment.sh
          cat "$RUNNER_TEMP/vuc-environment.json"
      - name: Build CLI
        run: npm run build:cli
      - name: Start Ollama, execute model and independently verify proof
        env:
          VUC_OLLAMA_MODEL: qwen2.5-coder:0.5b
          VUC_OLLAMA_DIGEST: 4ff64a7f502a08b7616edb8ca0a79eb1853fc363d842b7df4b46915d11a3fb09
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          command -v ollama
          ollama --version
          mkdir -p "$OLLAMA_MODELS"
          ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/ollama.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = true
          ollama pull "$VUC_OLLAMA_MODEL"
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const expectedModel = process.env.VUC_OLLAMA_MODEL;
          const expectedDigest = process.env.VUC_OLLAMA_DIGEST;
          const raw = execFileSync('curl', ['--fail','--silent','--show-error',`http://${process.env.OLLAMA_HOST}/api/tags`], {encoding:'utf8'});
          const data = JSON.parse(raw);
          const model = (data.models || []).find(m => m.name === expectedModel || m.model === expectedModel);
          if (!model) throw new Error('REAL_LLM_MODEL_MISSING');
          if (model.digest !== expectedDigest) throw new Error(`REAL_LLM_MODEL_DIGEST_MISMATCH got=${model.digest} expected=${expectedDigest}`);
          console.log(JSON.stringify({provider:'ollama',model:model.name||model.model,digest:model.digest,size:model.size,quantization:model.details?.quantization_level||null,parameters:model.details?.parameter_size||null},null,2));
          NODE
          PROOF="$RUNNER_TEMP/micro-llm-proof.json"
          PUB="$RUNNER_TEMP/micro-llm-public.pem"
          OUT="$RUNNER_TEMP/micro-llm-output.txt"
          node dist/vua.cjs llm --provider ollama --model "$VUC_OLLAMA_MODEL" --url "http://$OLLAMA_HOST" --temperature 0 --seed 7 --prompt 'Digite exatamente: X7Q' --proof-out "$PROOF" --public-key-out "$PUB" >"$OUT" 2>&1
          test -s "$PROOF"
          test -s "$PUB"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "$PROOF"
          KEY_ID="$(node -p "require(process.argv[1]).identity.key_id" "$PROOF")"
          TRUST="$RUNNER_TEMP/$KEY_ID.pem"
          mv "$PUB" "$TRUST"
          node scripts/verify-independent-proof.mjs "$PROOF" "$TRUST"
          RESPONSE="$(awk '/📝 RESPOSTA(:| DO MODELO:)/ {capture=1; next} /^─/ {capture=0} capture {print}' "$OUT" | sed '/^[[:space:]]*$/d' | sed 's/[[:space:]]*$//')"
          test "$RESPONSE" = X7Q
          mkdir -p reports/micro-llm-benchmark
          node -e 'const p=require(process.argv[1]); console.log(JSON.stringify({schema:"vuc.micro-llm-evidence.v2",model:p.model,model_provenance:p.model_provenance,proof_hash:p.proof_hash,input_hash:p.input_hash,output_hash:p.output_hash,seed:p.execution?.seed,temperature:p.execution?.temperature,status:"PASS_INDEPENDENTLY_VERIFIED"},null,2))' "$PROOF" > reports/micro-llm-benchmark/execution-evidence.json
          cat reports/micro-llm-benchmark/execution-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-llm-execution-evidence
          path: reports/micro-llm-benchmark/execution-evidence.json
