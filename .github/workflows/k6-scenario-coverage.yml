name: K6 Scenario Coverage

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  k6-scenarios:
    name: K6 scenarios and industry coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start VUA HTTP server
        run: |
          npm run dev > /tmp/vua-server.log 2>&1 &
          echo $! > /tmp/vua-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health >/tmp/vua-health.json; then
              cat /tmp/vua-health.json
              break
            fi
            sleep 1
          done
          test -s /tmp/vua-health.json

      - name: Run complete K6 scenario matrix
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -e
          npm run test:k6:smoke
          npm run test:k6:load
          npm run test:k6:stress
          npm run test:k6:spike
          npm run test:k6:soak
          npm run test:k6:chaos
          npm run test:k6:degradation
          npm run test:k6:industry

      - name: Publish server log
        if: always()
        run: cat /tmp/vua-server.log || true
