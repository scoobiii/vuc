name: s0-gate
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  s0-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/guard-s0.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          S0_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 's0-change-approved') }}
  s0-test:
    needs: s0-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:s0
