name: s0-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: s0-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  s0-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Aprovação (label s0-change-approved aplicada pelo dono)
        id: ap
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: scoobiii
        run: |
          set -euo pipefail
          has=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name]|index("s0-change-approved")!=null')
          by=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate --jq '.[]|select(.event=="labeled" and .label.name=="s0-change-approved")|.actor.login' | tail -n1)
          ok=false
          if [ "$has" = true ] && [ "$by" = "$OWNER" ]; then ok=true; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Guard (usa a versão da base quando existir)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          S0_CHANGE_APPROVED: ${{ steps.ap.outputs.ok || 'false' }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'verify' }}
        run: |
          set -euo pipefail
          g=scripts/guard-s0.sh
          if [ "$MODE" = pr ] && git cat-file -e "$BASE_SHA:scripts/guard-s0.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/guard-s0.sh" > "$RUNNER_TEMP/guard.sh"
            g="$RUNNER_TEMP/guard.sh"
          fi
          bash "$g" "$MODE"
  s0-test:
    needs: s0-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:s0
  s0-required:
    if: always()
    needs: [s0-guard, s0-test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "guard=${{ needs.s0-guard.result }} test=${{ needs.s0-test.result }}"
          test "${{ needs.s0-guard.result }}" = success
          test "${{ needs.s0-test.result }}" = success
