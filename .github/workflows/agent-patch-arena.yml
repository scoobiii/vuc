name: Agent Patch Arena — Benchmark Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  agent-tournament:
    name: Trusted benchmark comparison
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Universal CI Subjection Invariant
        run: |
          echo "🛡️ Enforcing VUA-SPEC-v2 Universal CI Subjection Clause..."
          echo "All proposers (autonomous agents, human developers, bot integrations) are strictly subject to CI gates."

      - name: Derive Changed Files from Base
        id: diff_files
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=50 || true
          CHANGED=$(git diff --name-only "$BASE_REF" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGED" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "Detected changed files for intent classification:"
          echo "$CHANGED"

      - name: Static Protocol Linting
        run: npm run lint

      - name: Execute Canary Side-Effect & Security Invariants
        if: ${{ always() }}
        run: |
          echo "🐤 Running Canary Invariants Gate..."
          npx tsx scripts/test-canary.ts

      - name: Execute Patch Arena Intent & Policy Tests
        if: ${{ always() }}
        run: |
          echo "🧪 Running Patch Arena Intent Classification & Policy Tests..."
          npx tsx tests/patch-arena-policy.test.ts

      - name: Run Patch Tournament Benchmark & Gain Comparator
        if: ${{ always() }}
        id: arena_eval
        run: |
          set -euo pipefail
          echo "🏆 Running measured base-vs-head benchmark (no simulated metrics)..."
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=100
          python3 scripts/agent-patch-arena.py \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --output arena_output.json
          cat arena_output.json
          test "$(node -p "require('./arena_output.json').verdict")" = "PASS_SUPERIOR"

      - name: Evaluate Intent-Aware Decision Gate for Auto-Merge
        if: ${{ always() }}
        id: merge_gate
        run: |
          set -euo pipefail
          verdict="$(node -p "require('./arena_output.json').verdict")"
          if [ "$verdict" = "PASS_SUPERIOR" ]; then
            echo "superior_found=true" >> "$GITHUB_OUTPUT"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "✅ Patch achieved intent-approved verdict in Arena."
          else
            echo "superior_found=false" >> "$GITHUB_OUTPUT"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No patch achieved approved verdict (regression, manual review or disqualified). Auto-merge forbidden."
            exit 1
          fi

      - name: Comment Arena Leaderboard & Decision on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No arena output captured';
            if (fs.existsSync('arena_output.json')) {
              output = fs.readFileSync('arena_output.json', 'utf8');
            }
            const body = `### 🏆 Vortex Patch Arena — Measured Base vs Head

```text
${output}
```

*Evaluated by deterministic cryptographic CI gates with Intent-Aware Baseline Gain Comparator.*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Archive Arena Cryptographic Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-arena-evidence
          path: arena_output.json
