name: Agent Patch Arena — Benchmark Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main, develop ]
  workflow_dispatch:

# PR code is untrusted. This workflow must never receive write-capable tokens.
permissions:
  contents: read

jobs:
  agent-tournament:
    name: Read-only measured benchmark comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Verify universal CI subjection invariant
        run: |
          echo "All proposers are subject to the same CI gates."

      - name: Static protocol linting
        run: npm run lint

      - name: Execute canary security invariants
        run: npx tsx scripts/test-canary.ts

      - name: Execute Patch Arena policy tests
        run: npx tsx tests/patch-arena-policy.test.ts

      - name: Run measured base-vs-head evaluator
        id: arena_eval
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH" --depth=100
          python3 scripts/agent-patch-arena.py \
            --base "origin/$BASE_BRANCH" \
            --head HEAD \
            --output arena_output.json
          cat arena_output.json
          verdict="$(node -p "require('./arena_output.json').verdict")"
          case "$verdict" in
            PASS_SUPERIOR|PASS_SECURITY|PASS_GOVERNANCE|PASS_CORRECTNESS|NEEDS_MANUAL_REVIEW) ;;
            *) echo "Arena rejected candidate: $verdict"; exit 1 ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Enforce fail-closed decision gate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ ! -s arena_output.json ]; then
            echo "FAIL_CLOSED: evaluator produced no evidence."
            exit 1
          fi
          verdict="$(node -p "require('./arena_output.json').verdict")"
          case "$verdict" in
            PASS_SUPERIOR|PASS_SECURITY|PASS_GOVERNANCE|PASS_CORRECTNESS)
              echo "Quality verdict accepted; GitHub branch protection and review still apply."
              ;;
            NEEDS_MANUAL_REVIEW)
              echo "Manual review required; this result does not authorize merge."
              exit 1
              ;;
            *)
              echo "FAIL_CLOSED: rejected or unknown verdict."
              exit 1
              ;;
          esac

      - name: Archive Arena evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-arena-evidence
          path: arena_output.json
          if-no-files-found: warn
