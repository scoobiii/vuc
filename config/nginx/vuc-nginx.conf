# Vortex Universal Connector (VUC) - High-Performance Nginx Reverse Proxy
# & Database Load Balancer Configuration
# Architecture: Cloud SQL + Firestore + SQLite Tri-Sync Ledger Proxy

worker_processes auto;
pid /tmp/vuc_nginx.pid;
error_log /tmp/vuc_nginx_error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Request Buffers
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Timeouts for High Concurrency Bancamento
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Rate Limiting Zones (Protection against DDoS and Spikes)
    limit_req_zone $binary_remote_addr zone=db_api_limit:10m rate=300r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Fast In-Memory Cache for Immutable Proofs
    proxy_cache_path /tmp/vuc_nginx_cache levels=1:2 keys_zone=vuc_cache:10m max_size=250m inactive=60m use_temp_path=off;

    # Upstream Cluster for VUC Node.js Backend & Tri-Sync Database
    upstream vuc_cluster {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Logging Format with Latency & Cache Status
    log_format vuc_combined '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'cache=$upstream_cache_status';

    access_log /tmp/vuc_nginx_access.log vuc_combined;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse Proxy & Load Balancer Server
    server {
        listen 3080;
        server_name localhost 127.0.0.1;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-VUC-Engine "Nginx-Reverse-Proxy-TriSync" always;

        # 1. Tri-Sync Database High-Throughput Proxy
        location /api/vuc/tri-sync/ {
            limit_req zone=db_api_limit burst=50 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://vuc_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Low latency buffers
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Direct pass without stale caching for write operations
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # 2. Immutable Cryptographic Proofs Cache (High Read Performance)
        location /api/vuc/tri-sync/export-json {
            proxy_pass http://vuc_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_cache vuc_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 3. DREX Real Digital & Energy DvP Financial Laws
        location /api/drex/ {
            limit_req zone=db_api_limit burst=30 nodelay;

            proxy_pass http://vuc_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
        }

        # 4. WebSockets & Realtime State Streaming
        location /api/ {
            proxy_pass http://vuc_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Static Assets & SPA Root
        location / {
            proxy_pass http://vuc_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. Nginx Metrics for Load Bancamento Inspection
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
